<div class="page-container">

  <div class="theme-toggle-container">
    <button class="theme-toggle" (click)="theme.toggleDark()">
      {{ theme.isDark() ? '☀️ Mode Clair' : '🌙 Mode Sombre' }}
    </button>
  </div>

  <app-search-bar (search)="onSearch($event.season, $event.year, $event.filters)" class="search-bar"></app-search-bar>

  <div class="status">
    <p>Pages chargées : {{ currentPage() }} / {{ totalPages() }}</p>
    @if(loading()){
      <p class="loading">🔄 Chargement des résultats…</p>
    }
    @if(!loading() && noResults()){
      <p class="no-results">😕 Aucun anime trouvé pour cette recherche.</p>
    }
  </div>

  <app-tier-board
    [unassignedTypes]="unassignedByType"
    class="tier-board-container">
  </app-tier-board>

</div>
