<div class="page-container">
  <app-search-bar (search)="onSearch($event.season, $event.year, $event.filters)" class="search-bar"></app-search-bar>

  <div class="status">
    <p>Pages loaded: {{ currentPage() }} / {{ totalPages() }}</p>
    @if(loading()){
      <p class="loading">🔄 Loading results…</p>
    }
    @if(!loading() && noResults()){
      <p class="no-results">😕 No anime found for this search.</p>
    }
  </div>

  <app-tier-board
    [unassignedTypes]="unassignedByType"
    class="tier-board-container">
  </app-tier-board>

</div>
