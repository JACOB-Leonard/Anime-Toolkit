<div *ngFor="let tier of tierNames; let i = index" class="tier-row">
  <div class="tier-label-box" [style.background]="getTierColor(tier, i)">
    <input [(ngModel)]="tierListLabels[tier]" class="tier-label" />
  </div>

  <div
    class="tier-content"
    cdkDropList
    [cdkDropListData]="tierList[tier]"
    [cdkDropListConnectedTo]="dropListIds"
    [id]="'tier-' + tier"
    (cdkDropListDropped)="onDrop($event, tier)"
  >
    <div *ngFor="let anime of tierList[tier]" cdkDrag>
      <app-anime-card [anime]="anime"></app-anime-card>
    </div>
  </div>

  <div class="tier-actions">
    <button (click)="openSettings(tier, i)" title="Paramètres">⚙</button>
    <button (click)="moveTierUp(i)" [disabled]="i === 0" title="Monter">⬆</button>
    <button
      (click)="moveTierDown(i)"
      [disabled]="i === tierNames.length - 1"
      title="Descendre"
    >
      ⬇
    </button>
  </div>
</div>

<div class="tier-row unassigned-row">
  <div
    class="tier-content"
    cdkDropList
    id="unassigned"
    [cdkDropListData]="unassigned"
    [cdkDropListConnectedTo]="dropListIds"
    (cdkDropListDropped)="onDrop($event, 'unassigned')"
  >
    <div *ngFor="let anime of unassigned" cdkDrag>
      <app-anime-card [anime]="anime"></app-anime-card>
    </div>
  </div>
</div>

<app-tier-settings-modal
  *ngIf="selectedTier"
  [tier]="selectedTier"
  [label]="tierListLabels[selectedTier]"
  [color]="tierColors[selectedTier]"
  [index]="selectedTierIndex"
  (addAbove)="addTierAbove(selectedTierIndex)"
  (addBelow)="addTierBelow(selectedTierIndex)"
  (colorChange)="updateTierColor($event)"
  (clearTier)="clearTier(selectedTier)"
  (deleteTier)="removeTier(selectedTierIndex)"
  (close)="closeSettings()"
></app-tier-settings-modal>
