<form class="search-bar" (ngSubmit)="onSubmit()">
  <div class="search-main">
    <!-- Saison -->
    <div class="field">
      <label>Saison</label>
      <select [ngModel]="season()" (ngModelChange)="season.set($event)" name="season">
        <option value="">Toute l’année</option>
        <option value="winter">❄️ Winter</option>
        <option value="spring">🌸 Spring</option>
        <option value="summer">☀️ Summer</option>
        <option value="fall">🍂 Fall</option>
      </select>
    </div>

    <!-- Année -->
    <div class="field">
      <label>Année</label>
      <input
        type="number"
        [ngModel]="year()"
        (ngModelChange)="year.set($event)"
        name="year"
        min="1917"
        max="2100"
      />
    </div>

    <!-- Filtres -->
    <div class="filters">
      <label class="filter-chip">
        <input
          type="checkbox"
          [checked]="allSelected()"
          (change)="toggleAll()"
        />
        <span>All</span>
      </label>
      
      @for (type of animeTypes(); track type.value) {
        <label class="filter-chip">
          <input
            type="checkbox"
            [checked]="type.checked"
            [name]="'filter-' + type.value"
            (change)="toggleType(type.value)"
          />
          <span>{{ type.label }}</span>
        </label>
      }
    </div>

    <!-- Bouton -->
    <button type="submit" class="search-btn">
      🔍 Rechercher
    </button>
  </div>
</form>
